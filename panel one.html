<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin</title>
<style>
  :root {
    --bg: #15171c;
    --surface: #1d2128;
    --surface-2: #242830;
    --border: #2a2f3a;
    --text: #e4e6eb;
    --muted: #8b919e;
    --accent: #5eead4;
    --accent-dim: #2dd4bf;
    --warning: #f0b454;
    --danger: #f0746a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }

  .app { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .brand span { color: var(--accent); }

  .timestamp {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  nav.tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  nav.tabs button {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    letter-spacing: 0.01em;
  }

  nav.tabs button:hover { color: var(--text); }

  nav.tabs button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.2s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .panel-header h2 {
    font-size: 18px;
    font-weight: 700;
  }

  .panel-header .meta {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .toolbar input[type="text"] {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 12px;
    font-size: 13px;
    flex: 1;
    outline: none;
  }

  .toolbar input[type="text"]:focus {
    border-color: var(--accent-dim);
  }

  .toolbar button.add {
    background: var(--accent);
    color: #0b1110;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  .toolbar button.add:hover { background: var(--accent-dim); }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    font-size: 13px;
  }

  thead th {
    background: var(--surface-2);
    color: var(--muted);
    text-align: left;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }

  thead th.num { text-align: right; }

  tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tbody tr:last-child td { border-bottom: none; }

  tbody tr:hover { background: rgba(255,255,255,0.02); }

  td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
  }

  .status-pill.active { background: rgba(94,234,212,0.12); color: var(--accent); }
  .status-pill.inactive { background: rgba(240,116,106,0.12); color: var(--danger); }
  .status-pill.pending { background: rgba(240,180,84,0.12); color: var(--warning); }

  .status-pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }

  .role-tag {
    font-size: 11px;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 4px;
  }

  /* sparkline bar for credits/commissions */
  .bar-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: flex-end;
  }

  .bar-track {
    width: 70px;
    height: 6px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
  }

  .bar-fill.warning { background: var(--warning); }
  .bar-fill.danger { background: var(--danger); }

  .actions { display: flex; gap: 6px; justify-content: flex-end; }

  .actions button {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .actions button:hover { color: var(--text); border-color: var(--accent-dim); }
  .actions button.danger:hover { color: var(--danger); border-color: var(--danger); }

  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }

  .stat-card .label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  .stat-card .value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .stat-card .value.accent { color: var(--accent); }
  .stat-card .value.warning { color: var(--warning); }

  @media (max-width: 720px) {
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    table, thead, tbody, th, td, tr { font-size: 12px; }
    th, td { padding: 8px 8px; }
    .bar-track { width: 40px; }
    nav.tabs { overflow-x: auto; white-space: nowrap; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">Panel<span>Admin</span></div>
    <div class="timestamp" id="clock"></div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="users">Usuarios</button>
    <button class="tab-btn" data-tab="resellers">Resellers</button>
    <button class="tab-btn" data-tab="credits">Créditos</button>
    <button class="tab-btn" data-tab="commissions">Comisiones</button>
  </nav>

  <!-- USERS -->
  <section class="panel active" id="panel-users">
    <div class="panel-header">
      <h2>Usuarios</h2>
      <div class="meta" id="users-count"></div>
    </div>
    <div class="stat-row" id="users-stats"></div>
    <div class="toolbar">
      <input type="text" id="users-search" placeholder="Buscar por nombre o usuario...">
      <button class="add" data-target="users">+ Nuevo usuario</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Usuario</th>
          <th>Nombre</th>
          <th>Plan</th>
          <th>Estado</th>
          <th>Vence</th>
          <th class="num"></th>
        </tr>
      </thead>
      <tbody id="users-body"></tbody>
    </table>
  </section>

  <!-- RESELLERS -->
  <section class="panel" id="panel-resellers">
    <div class="panel-header">
      <h2>Resellers</h2>
      <div class="meta" id="resellers-count"></div>
    </div>
    <div class="toolbar">
      <input type="text" id="resellers-search" placeholder="Buscar reseller...">
      <button class="add" data-target="resellers">+ Nuevo reseller</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Reseller</th>
          <th>Nivel</th>
          <th class="num">Clientes</th>
          <th class="num">Saldo</th>
          <th>Estado</th>
          <th class="num"></th>
        </tr>
      </thead>
      <tbody id="resellers-body"></tbody>
    </table>
  </section>

  <!-- CREDITS -->
  <section class="panel" id="panel-credits">
    <div class="panel-header">
      <h2>Créditos</h2>
      <div class="meta" id="credits-count"></div>
    </div>
    <div class="stat-row" id="credits-stats"></div>
    <div class="toolbar">
      <input type="text" id="credits-search" placeholder="Buscar por cuenta...">
      <button class="add" data-target="credits">+ Asignar créditos</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Cuenta</th>
          <th>Tipo</th>
          <th class="num">Saldo</th>
          <th class="num">Uso</th>
          <th class="num"></th>
        </tr>
      </thead>
      <tbody id="credits-body"></tbody>
    </table>
  </section>

  <!-- COMMISSIONS -->
  <section class="panel" id="panel-commissions">
    <div class="panel-header">
      <h2>Comisiones</h2>
      <div class="meta" id="commissions-count"></div>
    </div>
    <div class="toolbar">
      <input type="text" id="commissions-search" placeholder="Buscar por reseller...">
      <button class="add" data-target="commissions">+ Registrar comisión</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Reseller</th>
          <th>Periodo</th>
          <th class="num">Ventas</th>
          <th class="num">Comisión</th>
          <th>Estado</th>
          <th class="num"></th>
        </tr>
      </thead>
      <tbody id="commissions-body"></tbody>
    </table>
  </section>

</div>

<script>
  // ---- Sample data (replace with API data) ----
  const data = {
    users: [
      { user: "jmartinez", name: "Juan Martínez", plan: "Premium", status: "active", expires: "2026-08-12" },
      { user: "lrodriguez", name: "Lucía Rodríguez", plan: "Básico", status: "active", expires: "2026-07-01" },
      { user: "cgonzalez", name: "Carlos González", plan: "Premium", status: "pending", expires: "2026-06-20" },
      { user: "abenitez", name: "Ana Benítez", plan: "Estándar", status: "inactive", expires: "2026-05-15" },
      { user: "rfernandez", name: "Rodrigo Fernández", plan: "Premium", status: "active", expires: "2026-09-30" },
    ],
    resellers: [
      { name: "Norte Streaming", level: "Gold", clients: 142, balance: 4820, status: "active" },
      { name: "Sur Digital", level: "Silver", clients: 67, balance: 1120, status: "active" },
      { name: "Este Media", level: "Bronze", clients: 18, balance: 95, status: "pending" },
      { name: "Oeste TV", level: "Gold", clients: 203, balance: 7640, status: "active" },
    ],
    credits: [
      { account: "Norte Streaming", type: "Reseller", balance: 4820, max: 10000 },
      { account: "Sur Digital", type: "Reseller", balance: 1120, max: 5000 },
      { account: "jmartinez", type: "Usuario", balance: 30, max: 100 },
      { account: "Este Media", type: "Reseller", balance: 95, max: 2000 },
    ],
    commissions: [
      { reseller: "Norte Streaming", period: "Mayo 2026", sales: 8400, commission: 840, status: "pagado" },
      { reseller: "Oeste TV", period: "Mayo 2026", sales: 12300, commission: 1230, status: "pendiente" },
      { reseller: "Sur Digital", period: "Mayo 2026", sales: 2100, commission: 210, status: "pagado" },
    ]
  };

  // ---- Helpers ----
  function statusPill(status) {
    const labels = { active: "Activo", inactive: "Inactivo", pending: "Pendiente", pagado: "Pagado", pendiente: "Pendiente" };
    const cls = status === "active" || status === "pagado" ? "active"
              : status === "pending" || status === "pendiente" ? "pending"
              : "inactive";
    return `<span class="status-pill ${cls}"><span class="dot"></span>${labels[status] || status}</span>`;
  }

  function barFill(pct) {
    const cls = pct > 70 ? "" : pct > 30 ? "warning" : "danger";
    return `<div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>`;
  }

  function fmtMoney(n) {
    return "$" + n.toLocaleString("es-UY");
  }

  function rowActions(extra = "") {
    return `<div class="actions"><button>Editar</button><button class="danger">Borrar</button>${extra}</div>`;
  }

  // ---- Renderers ----
  function renderUsers() {
    const body = document.getElementById("users-body");
    const list = data.users;
    document.getElementById("users-count").textContent = `${list.length} registros`;

    const active = list.filter(u => u.status === "active").length;
    const pending = list.filter(u => u.status === "pending").length;
    const inactive = list.filter(u => u.status === "inactive").length;
    document.getElementById("users-stats").innerHTML = `
      <div class="stat-card"><div class="label">Total</div><div class="value">${list.length}</div></div>
      <div class="stat-card"><div class="label">Activos</div><div class="value accent">${active}</div></div>
      <div class="stat-card"><div class="label">Pendientes</div><div class="value warning">${pending}</div></div>
      <div class="stat-card"><div class="label">Inactivos</div><div class="value">${inactive}</div></div>
    `;

    if (!list.length) {
      body.innerHTML = `<tr><td colspan="6" class="empty">No hay usuarios registrados todavía.</td></tr>`;
      return;
    }

    body.innerHTML = list.map(u => `
      <tr>
        <td>${u.user}</td>
        <td>${u.name}</td>
        <td><span class="role-tag">${u.plan}</span></td>
        <td>${statusPill(u.status)}</td>
        <td>${u.expires}</td>
        <td class="num">${rowActions()}</td>
      </tr>
    `).join("");
  }

  function renderResellers() {
    const body = document.getElementById("resellers-body");
    const list = data.resellers;
    document.getElementById("resellers-count").textContent = `${list.length} registros`;

    if (!list.length) {
      body.innerHTML = `<tr><td colspan="6" class="empty">No hay resellers registrados todavía.</td></tr>`;
      return;
    }

    body.innerHTML = list.map(r => `
      <tr>
        <td>${r.name}</td>
        <td><span class="role-tag">${r.level}</span></td>
        <td class="num">${r.clients}</td>
        <td class="num">${fmtMoney(r.balance)}</td>
        <td>${statusPill(r.status)}</td>
        <td class="num">${rowActions()}</td>
      </tr>
    `).join("");
  }

  function renderCredits() {
    const body = document.getElementById("credits-body");
    const list = data.credits;
    document.getElementById("credits-count").textContent = `${list.length} cuentas`;

    const total = list.reduce((s, c) => s + c.balance, 0);
    const totalMax = list.reduce((s, c) => s + c.max, 0);
    const low = list.filter(c => (c.balance / c.max) * 100 <= 30).length;
    document.getElementById("credits-stats").innerHTML = `
      <div class="stat-card"><div class="label">Cuentas</div><div class="value">${list.length}</div></div>
      <div class="stat-card"><div class="label">Saldo total</div><div class="value accent">${fmtMoney(total)}</div></div>
      <div class="stat-card"><div class="label">Capacidad total</div><div class="value">${fmtMoney(totalMax)}</div></div>
      <div class="stat-card"><div class="label">Saldo bajo</div><div class="value warning">${low}</div></div>
    `;

    if (!list.length) {
      body.innerHTML = `<tr><td colspan="5" class="empty">No hay cuentas con créditos asignados todavía.</td></tr>`;
      return;
    }

    body.innerHTML = list.map(c => {
      const pct = Math.round((c.balance / c.max) * 100);
      return `
      <tr>
        <td>${c.account}</td>
        <td><span class="role-tag">${c.type}</span></td>
        <td class="num">${fmtMoney(c.balance)}</td>
        <td class="num"><div class="bar-wrap">${pct}%${barFill(pct)}</div></td>
        <td class="num">${rowActions()}</td>
      </tr>
    `;
    }).join("");
  }

  function renderCommissions() {
    const body = document.getElementById("commissions-body");
    const list = data.commissions;
    document.getElementById("commissions-count").textContent = `${list.length} registros`;

    if (!list.length) {
      body.innerHTML = `<tr><td colspan="6" class="empty">No hay comisiones registradas todavía.</td></tr>`;
      return;
    }

    body.innerHTML = list.map(c => `
      <tr>
        <td>${c.reseller}</td>
        <td>${c.period}</td>
        <td class="num">${fmtMoney(c.sales)}</td>
        <td class="num">${fmtMoney(c.commission)}</td>
        <td>${statusPill(c.status)}</td>
        <td class="num">${rowActions()}</td>
      </tr>
    `).join("");
  }

  // ---- Tabs ----
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(`panel-${btn.dataset.tab}`).classList.add("active");
    });
  });

  // ---- Search filters (simple client-side) ----
  function setupSearch(inputId, list, renderFn, keys) {
    const input = document.getElementById(inputId);
    if (!input) return;
    input.addEventListener("input", () => {
      const q = input.value.toLowerCase();
      const filtered = list.filter(item =>
        keys.some(k => String(item[k]).toLowerCase().includes(q))
      );
      renderFn(filtered);
    });
  }

  // ---- Clock ----
  function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent = now.toLocaleString("es-UY", {
      dateStyle: "medium", timeStyle: "short"
    });
  }
  updateClock();
  setInterval(updateClock, 60000);

  // ---- Init ----
  renderUsers();
  renderResellers();
  renderCredits();
  renderCommissions();
</script>
</body>
</html>
