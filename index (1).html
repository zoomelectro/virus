<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamPanel – Mi IPTV</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .player-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    .channel-list {
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .channel-list-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .channel-list-header h2 {
      font-family: var(--font-head);
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .channel-search {
      margin-top: 0.75rem;
      position: relative;
    }

    .channel-search input {
      width: 100%;
      padding: 0.5rem 0.75rem 0.5rem 2rem;
      font-size: 13px;
    }

    .channel-search::before {
      content: '🔍';
      position: absolute;
      left: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 11px;
    }

    .cat-tabs {
      display: flex;
      gap: 0;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      padding: 0 0.5rem;
      flex-shrink: 0;
    }

    .cat-tabs::-webkit-scrollbar { height: 0; }

    .cat-tab {
      padding: 0.5rem 0.75rem;
      font-size: 12px;
      color: var(--text3);
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
      font-family: var(--font-body);
    }

    .cat-tab:hover  { color: var(--text); }
    .cat-tab.active { color: var(--accent2); border-color: var(--accent); }

    .channels-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .ch-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.1s;
    }

    .ch-item:hover  { background: var(--surface); }
    .ch-item.active { background: rgba(108,99,255,0.12); }

    .ch-logo {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--bg3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .ch-info strong {
      display: block;
      font-size: 13px;
      color: var(--text);
    }

    .ch-info small {
      font-size: 11px;
      color: var(--text3);
    }

    /* Player area */
    .player-area {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .player-topbar {
      height: 56px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      flex-shrink: 0;
    }

    .player-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }

    #videoPlayer {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .player-placeholder {
      text-align: center;
      color: var(--text3);
    }

    .player-placeholder h2 {
      font-family: var(--font-head);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .player-info-bar {
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .user-credits-bar {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 13px;
    }

    .credit-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34,211,160,0.1);
      border: 1px solid rgba(34,211,160,0.2);
      border-radius: 999px;
      padding: 4px 12px;
      color: var(--green);
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .player-layout { grid-template-columns: 1fr; }
      .channel-list { display: none; }
    }
  </style>
</head>
<body>
<div class="player-layout">

  <!-- Channel List -->
  <div class="channel-list">
    <div class="channel-list-header">
      <h2>⚡ StreamPanel</h2>
      <div class="channel-search">
        <input type="text" id="chSearch" placeholder="Buscar canal..." oninput="renderChannels()">
      </div>
    </div>

    <div class="cat-tabs" id="catTabs"></div>

    <div class="channels-scroll" id="channelsList"></div>
  </div>

  <!-- Player -->
  <div class="player-area">
    <div class="player-topbar">
      <div id="nowPlaying" style="font-weight:500;font-size:14px;">Selecciona un canal</div>
      <div class="flex gap-sm">
        <span id="userPlan" class="badge badge-purple"></span>
        <button class="btn btn-ghost btn-sm" onclick="DB.logout(); window.location.href='../index.html'">Salir ↩</button>
      </div>
    </div>

    <div class="player-wrap" id="playerWrap">
      <div class="player-placeholder">
        <div style="font-size:4rem;margin-bottom:1rem;">📺</div>
        <h2>Bienvenido a StreamPanel</h2>
        <p>Selecciona un canal de la lista para comenzar</p>
      </div>
      <video id="videoPlayer" controls style="display:none;"></video>
    </div>

    <div class="player-info-bar">
      <div class="user-credits-bar">
        <div class="credit-pill">💳 <span id="userCredits">0</span> créditos</div>
        <span class="text-muted">Vence: <strong id="userExpires" class="text-accent"></strong></span>
      </div>
      <div class="flex gap-sm">
        <button class="btn btn-ghost btn-sm" onclick="downloadM3U()">⬇ Mi M3U</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="../assets/js/db.js"></script>
<script>
  // Auth
  const u = DB.currentUser();
  if (!u) window.location.href = '../index.html';

  // Toast
  function toast(msg, type = 'info') {
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `${msg}`;
    document.getElementById('toastContainer').appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  let selectedCat = 'Todos';
  let currentChannel = null;

  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' });
  }

  function renderUserInfo() {
    document.getElementById('userCredits').textContent = u.credits;
    document.getElementById('userExpires').textContent = fmtDate(u.expiresAt);
    document.getElementById('userPlan').textContent = u.plan;
  }

  function renderCatTabs() {
    const channels = DB.getChannels().filter(c => c.status === 'active');
    const cats = ['Todos', ...new Set(channels.map(c => c.category))];
    document.getElementById('catTabs').innerHTML = cats.map(cat =>
      `<button class="cat-tab${cat === selectedCat ? ' active' : ''}" onclick="selectCat('${cat}')">${cat}</button>`
    ).join('');
  }

  function selectCat(cat) {
    selectedCat = cat;
    renderCatTabs();
    renderChannels();
  }

  function renderChannels() {
    const q = document.getElementById('chSearch').value.toLowerCase();
    let channels = DB.getChannels().filter(c => c.status === 'active');
    if (selectedCat !== 'Todos') channels = channels.filter(c => c.category === selectedCat);
    if (q) channels = channels.filter(c => c.name.toLowerCase().includes(q));

    const container = document.getElementById('channelsList');
    if (!channels.length) {
      container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text3);font-size:13px;">Sin canales</div>';
      return;
    }
    container.innerHTML = channels.map(ch => `
      <div class="ch-item${currentChannel && currentChannel.id === ch.id ? ' active' : ''}" onclick="playChannel('${ch.id}')">
        <div class="ch-logo">${ch.logo && ch.logo.startsWith('http') ? `<img src="${ch.logo}" style="width:24px;height:24px;object-fit:contain;">` : (ch.logo || '📺')}</div>
        <div class="ch-info">
          <strong>${ch.name}</strong>
          <small>${ch.category}</small>
        </div>
      </div>
    `).join('');
  }

  function playChannel(id) {
    if (u.status !== 'active') {
      toast('Tu cuenta está inactiva. Contacta al administrador.', 'error');
      return;
    }
    const ch = DB.getChannels().find(c => c.id === id);
    if (!ch) return;
    currentChannel = ch;

    document.getElementById('nowPlaying').textContent = `📺 ${ch.name}`;

    const placeholder = document.querySelector('.player-placeholder');
    const video = document.getElementById('videoPlayer');

    if (ch.url && (ch.url.endsWith('.m3u8') || ch.url.includes('http'))) {
      placeholder.style.display = 'none';
      video.style.display = 'block';
      video.src = ch.url;
      video.play().catch(() => {});
    } else {
      placeholder.style.display = 'block';
      video.style.display = 'none';
      placeholder.querySelector('h2').textContent = ch.name;
      placeholder.querySelector('p').textContent = 'Cargando stream...';
    }

    renderChannels();
  }

  function downloadM3U() {
    const m3u = DB.generateM3U(u.id);
    if (!m3u) { toast('No se puede generar la playlist.', 'error'); return; }
    const blob = new Blob([m3u], { type: 'application/x-mpegurl' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${u.username}_playlist.m3u`;
    a.click();
    toast('Playlist M3U descargada.', 'success');
  }

  renderUserInfo();
  renderCatTabs();
  renderChannels();
</script>
</body>
</html>
